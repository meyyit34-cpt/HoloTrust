
name: HoloTrust CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Format, test and WASM build
    runs-on: ubuntu-latest

    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: '--cfg getrandom_backend="custom" -C link-arg=--allow-undefined'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build zomes for WASM
        run: cargo build --workspace --release --target wasm32-unknown-unknown

      - name: Verify WASM artifacts
        run: |
          test -f target/wasm32-unknown-unknown/release/identity_integrity.wasm
          test -f target/wasm32-unknown-unknown/release/identity_coordinator.wasm
