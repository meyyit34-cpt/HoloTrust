
name: HoloTrust CI

on:
  push:
    branches:
      - main
      - security/review-integrity
  pull_request:
  workflow_dispatch:

concurrency:
  group: holotrust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Fast formatting checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  build-test-package:
    name: Build, test and package HoloTrust
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: '--cfg getrandom_backend="custom" -C link-arg=--allow-undefined'
      CARGO_BUILD_JOBS: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', 'rust-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build zomes for WASM
        run: cargo build --workspace --release --target wasm32-unknown-unknown

      - name: Verify WASM artifacts
        run: |
          test -s target/wasm32-unknown-unknown/release/identity_integrity.wasm
          test -s target/wasm32-unknown-unknown/release/identity_coordinator.wasm

      - name: Install Nix with Holochain cache
        id: nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://holochain-ci.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= holochain-ci.cachix.org-1:5IUSkZc0aoRS53rfkvH9Kid40NpyjwCMCzwRTXy+QN8=

      - name: Compile native tests
        run: cargo test --workspace --no-run

      - name: Package DNA and hApp
        if: ${{ !cancelled() && steps.nix.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          nix develop --print-build-logs 'github:holochain/holonix?ref=main-0.7' -c bash -euo pipefail -c '
            cd dnas/holotrust/workdir
            hc --version
            hc dna pack .
            hc app pack .
            test -s holotrust.dna
            test -s holotrust.happ
          '

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Verify packaged hApp
        run: |
          test -s dnas/holotrust/workdir/holotrust.dna
          test -s dnas/holotrust/workdir/holotrust.happ

      - name: Smoke test with real conductor
        shell: bash
        run: |
          set -Eeuo pipefail

          nix develop --print-build-logs 'github:holochain/holonix?ref=main-0.7' -c bash -euo pipefail -c '
            node --version
            npm install --prefix dev

            echo "ci-passphrase" | hc sandbox --piped -f=9000 generate dnas/holotrust/workdir/holotrust.happ --app-id holotrust --run=0 > sandbox.log 2>&1 &
            SANDBOX_PID=$!

            DEV_PID=""

            cleanup() {
              if [ -n "$DEV_PID" ]; then
                kill "$DEV_PID" 2>/dev/null || true
              fi
              kill "$SANDBOX_PID" 2>/dev/null || true
            }

            trap cleanup EXIT

            READY=0
            for i in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/9000) 2>/dev/null; then
                READY=1
                break
              fi
              sleep 2
            done

            if [ "$READY" -ne 1 ]; then
              echo "Conductor admin port 9000 did not become ready."
              tail -n 100 sandbox.log || true
              exit 1
            fi

            if ! node dev/smoke-test.mjs; then
              echo "Real conductor smoke test failed."
              tail -n 100 sandbox.log || true
              exit 1
            fi

            node dev/dev-server.mjs > dev-server.log 2>&1 &
            DEV_PID=$!

            PROXY_READY=0
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8080/hc/info > /dev/null; then
                PROXY_READY=1
                break
              fi
              sleep 1
            done

            if [ "$PROXY_READY" -ne 1 ]; then
              echo "Development proxy did not become ready."
              tail -n 100 dev-server.log || true
              exit 1
            fi

            if ! node dev/proxy-test.mjs; then
              echo "Proxy smoke test failed."
              tail -n 100 dev-server.log || true
              exit 1
            fi

            echo "HoloTrust conductor and proxy smoke tests passed."
          '

      - name: Upload hApp bundle
        uses: actions/upload-artifact@v7
        with:
          name: holotrust-happ
          path: dnas/holotrust/workdir/holotrust.happ
          if-no-files-found: error
